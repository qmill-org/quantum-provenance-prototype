name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the comparison replays tags v0.1.0 and baseline-freeze
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (offline extras only; no provider credentials are used)
        run: uv sync --extra dev --extra http --extra live
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (replay of committed captures; no network to providers)
        run: uv run pytest -q
      - name: Committed artifacts are reproducible
        run: |
          uv run python -m qmill_quantum_provenance.evaluation --check
          uv run python -m qmill_quantum_provenance.generate_examples --check
